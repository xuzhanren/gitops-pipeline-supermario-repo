name: Build, push, scan image, and update deployment/version

on:
  push:
    branches:
      - main

jobs:
  build_push_supermario_docker_image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate dynamic version
        id: versioning
        shell: bash
        run: |
          CURRENT_VERSION=$(cat version.txt 2>/dev/null || echo 0)
          NEW_VERSION=$((CURRENT_VERSION + 1))
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t docker.io/renxuzhan/supermario:${{ steps.versioning.outputs.version }} .
          docker push docker.io/renxuzhan/supermario:${{ steps.versioning.outputs.version }}

  run_container_image_scan_on_supermario_docker_image:
    runs-on: ubuntu-latest
    needs: build_push_supermario_docker_image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Docker image for scanning
        run: |
          docker pull docker.io/renxuzhan/supermario:${{ needs.build_push_supermario_docker_image.outputs.version }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docker.io/renxuzhan/supermario:${{ needs.build_push_supermario_docker_image.outputs.version }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  update_k8s_yaml_version_file_with_latest_image_tag:
    runs-on: ubuntu-latest
    needs: run_container_image_scan_on_supermario_docker_image

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Git Config
        run: |
          git config --global user.email "${{ secrets.GIT_EMAIL}}"
          git config --global user.name "${{ secrets.GIT_USERNAME}}"

      - name: Update Deployment YAML
        run: |
          git pull
          sed -i "s|image: renxuzhan/supermario:.*$|image: renxuzhan/supermario:${{ needs.build_push_supermario_docker_image.outputs.version }}|" deployment.yaml
          echo ${{ needs.build_push_supermario_docker_image.outputs.version }} > version.txt
          CURRENT_VERSION=$(cat version.txt)
          git add deployment.yaml version.txt
          git commit -m "Updated deployment yaml and version txt file with supermario image tag to ${CURRENT_VERSION}"
          git push
        env:
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  